<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackforyou Store</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      line-height: 1.6;
    }
    header {
      padding: 24px 20px;
      border-bottom: 1px solid #222;
      text-align: center;
    }
    header h1 { font-size: 28px; }
    header p { color: #aaa; margin-top: 5px; }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 40px auto;
    }

    .intro {
      text-align: center;
      margin-bottom: 35px;
    }
    .intro h2 { font-size: 24px; margin-bottom: 8px; }
    .intro p { color: #aaa; }

    .stock-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .card {
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      padding: 20px;
    }
    .card h3 { margin-bottom: 8px; }
    .card p { color: #aaa; margin-bottom: 14px; }
    .price {
      font-weight: bold;
      margin-bottom: 15px;
    }
    .button {
      display: block;
      text-align: center;
      text-decoration: none;
      background: #fff;
      color: #000;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
    }
    .button:hover { background: #ddd; }

    footer {
      text-align: center;
      color: #666;
      padding: 35px 20px;
      margin-top: 50px;
      border-top: 1px solid #222;
    }
  </style>
</head>
<body>

  <header>
    <h1>jackforyou store</h1>
    <p>tempat stok akun game</p>
  </header>

  <main class="container">
    <section class="intro">
      <h2>stok tersedia</h2>
      <p>pilih akun yang lu minati</p>
    </section>

    <section class="stock-list">

      <!-- copy bagian card ini untuk menambah stok -->
      <div class="card">
        <h3>akun free fire #001</h3>
        <p>detail akun di sini</p>
        <div class="price">Rp 500.000</div>
        <a class="button" href="https://wa.me/628XXXXXXXXXX" target="_blank">
          beli via whatsapp
        </a>
      </div>

      <div class="card">
        <h3>akun free fire #002</h3>
        <p>detail akun di sini</p>
        <div class="price">Rp 750.000</div>
        <a class="button" href="https://wa.me/628XXXXXXXXXX" target="_blank">
          beli via whatsapp
        </a>
      </div>

    </section>
  </main>

  <footer>
    © 2026 jackforyou store
  </footer>

</body>
</html>
